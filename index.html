<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin the Science Wheel</title>
<style>
:root{--c:#22d3ee;--y:#facc15;--o:#fb923c;--p:#a855f7;--b:#3b82f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;position:relative;background:radial-gradient(circle at 50% 15%,#22308f,#0b1030 70%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;padding:2vmin;text-align:center;overflow:auto}
.scr.on{display:flex}
h1{font-size:clamp(32px,8vmin,80px);margin:0;background:linear-gradient(90deg,var(--c),var(--y),var(--o));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.03em}
.sub{font-size:clamp(18px,3.4vmin,32px);color:#bfe7ff}
.btn{font:800 clamp(20px,4vmin,34px) inherit;font-family:inherit;padding:.7em 1.5em;border:0;border-radius:999px;background:linear-gradient(135deg,var(--c),var(--b));color:#fff;box-shadow:0 6px 0 #0a2a6b,0 0 24px #22d3ee88;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0a2a6b}
.btn.y{background:linear-gradient(135deg,var(--y),var(--o));color:#3a2200;box-shadow:0 6px 0 #8a4a00,0 0 24px #facc1588}
.btn.g{background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 6px 0 #0b4a22}
.btn.r{background:linear-gradient(135deg,#f43f5e,#be123c);box-shadow:0 6px 0 #6b0a24}
.btn.big{font-size:clamp(28px,6vmin,56px);padding:.55em 1.8em}
.row2{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center}
.top{position:absolute;top:1.5vmin;inset-inline:2vmin;display:flex;justify-content:space-between;align-items:center;z-index:3}
.pill{background:#ffffff1c;border:2px solid #22d3ee88;border-radius:999px;padding:.4em 1em;font-weight:800;font-size:clamp(16px,3vmin,26px)}
.ib{width:clamp(48px,8vmin,70px);height:clamp(48px,8vmin,70px);border-radius:50%;border:2px solid #fff4;background:#ffffff1c;color:#fff;font-size:clamp(18px,3.4vmin,28px);font-weight:800;cursor:pointer}
#wh{position:relative;width:min(74vw,58vh);aspect-ratio:1;margin-top:6vmin}
#wh canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 40px #22d3eecc,0 0 0 8px #ffffff33;transition:transform 4.6s cubic-bezier(.1,.65,.1,1)}
#ptr{position:absolute;top:-4%;left:50%;margin-left:-3.5vmin;width:0;height:0;border-left:3.5vmin solid transparent;border-right:3.5vmin solid transparent;border-top:7vmin solid var(--y);filter:drop-shadow(0 0 10px #facc15);z-index:2}
#hub{position:absolute;inset:41%;border-radius:50%;background:radial-gradient(#fff,#22d3ee);box-shadow:0 0 20px #fff;display:flex;align-items:center;justify-content:center;font-size:5vmin}
.hd{font-size:clamp(24px,5vmin,48px);font-weight:800;color:var(--y)}
#tw{width:min(800px,86vw);display:flex;align-items:center;gap:2vmin}
#barw{flex:1;height:2.4vmin;background:#ffffff22;border-radius:99px;overflow:hidden}
#bar{height:100%;width:100%;background:linear-gradient(90deg,var(--o),var(--y));border-radius:99px}
#num{font-size:clamp(24px,5vmin,44px);font-weight:800;min-width:1.6em}
#stage{width:min(900px,94vw);display:flex;flex-direction:column;gap:2vmin;align-items:stretch}
.q{font-size:clamp(24px,5vmin,46px);font-weight:800;line-height:1.3}
.opt{font:700 clamp(20px,4vmin,34px) inherit;font-family:inherit;padding:.7em 1em;border-radius:22px;border:3px solid var(--c);background:#ffffff1f;color:#fff;cursor:pointer}
.opt.good{background:#16a34a;border-color:#86efac;animation:pop .4s}
.opt.bad{background:#dc2626;border-color:#fca5a5}
.ex{font-size:clamp(18px,3.4vmin,30px);color:var(--y);min-height:1.3em}
.hint{font-size:clamp(18px,3.2vmin,28px);color:#bfe7ff}
.mt{display:flex;flex-direction:column;gap:1.6vmin}
.row{display:flex;gap:2vmin;align-items:center;justify-content:center}
.mat{flex:1;padding:.7em;border-radius:18px;background:linear-gradient(135deg,var(--p),var(--b));font-weight:800;font-size:clamp(20px,4vmin,34px)}
.slot{flex:1.3;min-height:2.4em;border:3px dashed #fff8;border-radius:18px;display:flex;align-items:stretch;justify-content:center;font-size:clamp(18px,3.6vmin,30px)}
.slot.good{border-color:#4ade80;background:#16a34a55}.slot.bad{border-color:#f87171;background:#dc262655}
.slot .chip{flex:1}
.pv{flex:1.3;padding:.7em;border-radius:18px;background:#16a34a55;border:3px solid #4ade80;font-weight:700;font-size:clamp(18px,3.6vmin,30px)}
.chips{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center;margin-top:1vmin}
.chip{padding:.6em 1em;border-radius:16px;background:linear-gradient(135deg,var(--y),var(--o));color:#3a2200;font-weight:800;font-size:clamp(18px,3.6vmin,30px);touch-action:none;cursor:grab;position:relative;display:flex;align-items:center;justify-content:center}
.chip.dg{z-index:20;box-shadow:0 10px 30px #000a;scale:1.08}
#ov{position:fixed;inset:0;z-index:40;background:#0b1030ee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;font-size:clamp(34px,8vmin,80px);font-weight:900}
#ov span{font-size:clamp(90px,24vmin,240px)}
#ov.on{display:flex;animation:pop .5s}
#cf{position:fixed;inset:0;z-index:50;pointer-events:none}
.rt{font-size:clamp(34px,8vmin,76px);font-weight:900;color:var(--y);animation:pop .6s}
.rp{font-size:clamp(60px,16vmin,160px);font-weight:900;color:var(--c);text-shadow:0 0 30px #22d3ee}
.fact{max-width:min(800px,90vw);padding:1.4vmin 2.4vmin;border-radius:20px;background:#ffffff1a;border:2px solid #facc1588;font-size:clamp(18px,3.4vmin,30px)}
.vs{font-size:clamp(30px,7vmin,64px);font-weight:900;color:var(--o)}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pulse{animation:pop .35s}
#ni{font:800 clamp(28px,6vmin,56px) inherit;font-family:inherit;width:min(80vw,700px);padding:.5em;border-radius:20px;border:3px solid var(--c);background:#fff;color:#0b1030;text-align:center;-webkit-user-select:text;user-select:text;outline:0}
#cpv{width:min(60vw,900px);height:auto;border-radius:12px;box-shadow:0 0 30px #22d3ee88}
.qp{display:flex;flex-direction:column;align-items:center;gap:2vmin;max-width:min(34vw,380px)}
#qr{width:min(30vw,38vh,340px);height:auto;border-radius:12px;background:#fff}
#cpi{width:min(96vw,1100px);height:auto;border-radius:10px;-webkit-user-select:auto;-webkit-touch-callout:default}
</style></head><body>

/* sound, confetti */
function sfx(k){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const s={tick:[[900,.03,'square']],ok:[[600,.1],[800,.1],[1000,.15]],no:[[300,.2,'sawtooth'],[200,.25,'sawtooth']],win:[[523,.12],[659,.12],[784,.12],[1047,.3]],go:[[400,.1],[700,.2]]}[k];let t=AC.currentTime;s.forEach(([f,d,y])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=y||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}
const cv=$('#cf'),cx=cv.getContext('2d');let P=[],run=false;
function conf(n){cv.width=innerWidth;cv.height=innerHeight;for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*18,vy:-Math.random()*18-4,c:`hsl(${Math.random()*360},90%,60%)`,s:8+Math.random()*8,r:0});if(!run){run=true;lp()}}
function lp(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.y<cv.height+30);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*.6)});if(P.length)requestAnimationFrame(lp);else run=false}

/* shell */
function show(id){clearInterval(tm);$$('.scr').forEach(s=>s.classList.toggle('on',s.id==id));upd()}

function setLang(l){L=l;document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';$$('[data-u]').forEach(e=>e.textContent=T(U[e.dataset.u]));$('#lg').textContent=l=='ar'?'EN':'ع';draw()}
function go(l){setLang(l);show('s1')}
function draw(){const c=$('#wc'),g=c.getContext('2d'),r=400,a=Math.PI/4;g.clearRect(0,0,800,800);
W.forEach((w,i)=>{g.beginPath();g.moveTo(r,r);g.arc(r,r,r-6,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);g.closePath();g.fillStyle=w[2];g.fill();g.strokeStyle='#fff';g.lineWidth=5;g.stroke();
g.save();g.translate(r,r);g.rotate(-Math.PI/2+(i+.5)*a);g.textAlign='center';g.textBaseline='middle';g.font='46px sans-serif';g.fillText(w[0],r*.84,0);g.font='800 21px system-ui,sans-serif';g.fillStyle='#0b1030';g.fillText(T(w[1]),r*.43,0);g.restore()})}
function spin(){if(spinning)return;spinning=true;sfx('go');const i=Math.random()*8|0,tg=-(i*45+22.5+(Math.random()*30-15)),cur=((rot%360)+360)%360,d=(((tg-cur)%360)+360)%360;rot+=360*5+d;
$('#wc').style.transform=`rotate(${rot}deg)`;let t=0,gap=60;while(t<4400){setTimeout(()=>sfx('tick'),t);t+=gap;gap*=1.09}
setTimeout(()=>{sfx('win');const o=$('#ov');o.innerHTML=`<span>${W[i][0]}</span>${T(W[i][1])}`;o.style.color=W[i][2];o.classList.add('on');setTimeout(()=>{o.classList.remove('on');spinning=false;start(i)},1400)},4700)}

/* helpers */
function timer(sec,end){clearInterval(tm);tl=sec;const b=$('#bar'),n=$('#num');b.style.width='100%';n.textContent=sec;
tm=setInterval(()=>{tl-=.1;if(tl<=0){clearInterval(tm);tl=0;b.style.width=0;n.textContent=0;end()}else{b.style.width=tl/sec*100+'%';n.textContent=Math.ceil(tl)}},100)}
const sc=(f,left,t)=>Math.round(100*f+(f==1?50+50*left/t:0));
function fin(p,res,man){clearInterval(tm);score+=p;show('s3');lastR=p>=100?{c:cur,t:Math.round(Math.max(0,t1-t0)/100)/10}:null;$('#cb').style.display=lastR?'':'none';const w=R(WIN);
$('#rt').textContent=p>=100?T(w):p>0?T(U.part):T(R(FAIL));$('#rr').textContent=res;$('#rf').textContent=T(pk('f',FACTS));
const e=$('#rp');e.textContent='+0 '+T(U.pts);let v=0;const st=Math.max(1,p/25|0),iv=setInterval(()=>{v=Math.min(p,v+st);e.textContent='+'+v+' '+T(U.pts);if(v>=p)clearInterval(iv)},35);
if(p>=100){sfx('win');conf(p>=150?220:120)}else sfx(p>0?'ok':'no')}
function mcq(q,opts,c,ex,cb,fixed,pick){const st=$('#stage');let it=opts.map((o,i)=>({o:X(o),ok:i==c}));if(!fixed)it=sh(it);
st.innerHTML=`<div class="q">${T(q)}</div><div class="mt" id="ob"></div><div class="ex"></div>`;const bx=$('#ob');
it.forEach(x=>{const b=document.createElement('button');b.className='opt';b.textContent=T(x.o);b.onclick=()=>{if(bx.dataset.d)return;bx.dataset.d=1;stamp();pick&&pick();
[...bx.children].forEach((y,i)=>{if(it[i].ok)y.classList.add('good')});if(!x.ok)b.classList.add('bad');sfx(x.ok?'ok':'no');if(ex)st.querySelector('.ex').textContent=T(ex);setTimeout(()=>cb(x.ok),ex?2000:600)};bx.append(b)})}
function single(q,o,c,ex,fixed){let done=false;timer(15,()=>{done=true;fin(0,T(U.time))});
mcq(q,o,c,ex,r=>{if(!done||r!==undefined){done=true;fin(sc(r?1:0,tl,15),r?T(U.ok):T(U.no))}},fixed,()=>{clearInterval(tm);done=false})}
function drag(p,time){t0=performance.now();const st=$('#stage'),n=p.length,idx=p.map((_,i)=>i);
st.innerHTML=`<div class="q">${T(U.drag)}</div><div class="mt">`+sh(idx).map(i=>`<div class="row"><div class="mat">${T(p[i][0])}</div><div class="slot" data-i="${i}"></div></div>`).join('')+`</div><div class="chips">`+sh(idx).map(i=>`<div class="chip" data-i="${i}">${T(p[i][1])}</div>`).join('')+`</div>`;
let done=false;const grade=()=>{if(done)return;done=true;stamp();clearInterval(tm);let ok=0;$$('.slot').forEach(s=>{const g=s.firstChild&&s.firstChild.dataset.i==s.dataset.i;if(g)ok++;s.classList.add(g?'good':'bad')});sfx(ok==n?'ok':'no');const left=tl;setTimeout(()=>fin(sc(ok/n,left,time),ok+'/'+n),1500)};
timer(time,grade);
$$('.chip').forEach(ch=>{let x0,y0;ch.onpointerdown=e=>{if(done)return;ch.setPointerCapture(e.pointerId);x0=e.clientX;y0=e.clientY;ch.classList.add('dg')};
ch.onpointermove=e=>{if(ch.classList.contains('dg'))ch.style.transform=`translate(${e.clientX-x0}px,${e.clientY-y0}px)`};
ch.onpointerup=e=>{if(!ch.classList.contains('dg'))return;ch.classList.remove('dg');ch.style.pointerEvents='none';const t=document.elementFromPoint(e.clientX,e.clientY);ch.style.pointerEvents='';ch.style.transform='';const s=t&&t.closest('.slot');if(s&&!s.firstChild){s.append(ch);sfx('tick')}if($$('.slot').every(s=>s.firstChild))grade()}})}

(function nx(){if(done)return;if(n==3){done=true;return fin(sc(ok/3,tl,15),ok+'/3')}const[q,o,c]=qs[n++];mcq(q,o,c,null,r=>{if(r){ok++;$('#stage').classList.remove('pulse');void $('#stage').offsetWidth;$('#stage').classList.add('pulse')}nx()})})()}

function start(i){cur=i;t0=performance.now();show('s2');$('#tw').style.display='flex';$('#hd').textContent=W[i][0]+' '+T(W[i][1]);$('#stage').className='';CH[i]()}

/* ===== certificate + QR ===== */
const PUBLIC_URL=''; // optional: full public https URL of this file, e.g. 'https://you.github.io/wheel/index.html'
const CIMG=new Image(),cimgReady=new Promise(r=>{CIMG.onload=r;CIMG.onerror=r});CIMG.src=BG;
let t0=0,t1=0,cur=0,vname='',lastR=null,CPC=null;
const stamp=()=>t1=performance.now();
const clean=s=>String(s||'').replace(/[\u0000-\u001F<>]/g,'').replace(/\s+/g,' ').trim().slice(0,20);
function parseCert(){try{const q=new URLSearchParams(location.search);if(q.get('c')!='1')return null;const n=clean(q.get('n')),l=q.get('l'),c=+q.get('ch'),t=parseFloat(q.get('t'));
if(!n||(l!='ar'&&l!='en')||!(c>=0&&c<8&&c%1==0)||!(t>=0&&t<1000))return null;return{n,l,c,t:Math.round(t*10)/10}}catch(e){return null}}
function rr(g,x,y,w,h,r,f){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fillStyle=f;g.fill()}
function drawCert(cv,d){const W=CIMG.naturalWidth||1877,H=CIMG.naturalHeight||1048;cv.width=W;cv.height=H;const g=cv.getContext('2d');g.drawImage(CIMG,0,0,W,H);
const ar=d.l=='ar',F='"Segoe UI",Tahoma,"Geeza Pro","Noto Naskh Arabic",system-ui,Arial,sans-serif';
const fit=(txt,wt,sz,mx)=>{let s=sz;g.font=`${wt} ${s}px ${F}`;while(g.measureText(txt).width>mx&&s>H*.03){s*=.94;g.font=`${wt} ${s}px ${F}`}};
rr(g,W*.17,H*.485,W*.66,H*.40,H*.03,'rgba(8,16,40,.5)');rr(g,W*.29,H*.925,W*.42,H*.07,H*.035,'rgba(8,16,40,.62)');
g.textAlign='center';g.textBaseline='middle';g.shadowColor='rgba(0,0,0,.75)';g.shadowBlur=H*.012;g.shadowOffsetY=H*.004;
g.direction=ar?'rtl':'ltr';g.fillStyle='#8EDBFF';fit(ar?'تهانينا!':'CONGRATULATIONS!',800,H*.085,W*.6);g.fillText(ar?'تهانينا!':'CONGRATULATIONS!',W/2,H*.565);
g.direction=/[\u0600-\u06FF]/.test(d.n)?'rtl':'ltr';g.fillStyle='#fff';fit(d.n,800,H*.105,W*.6);g.fillText(d.n,W/2,H*.685);
g.direction=ar?'rtl':'ltr';const m=ar?'لقد اجتزت تحدي عجلة العلوم بنجاح!':'You successfully completed the Science Wheel Challenge!';
g.fillStyle='#DFF4FF';fit(m,600,H*.04,W*.62);g.fillText(m,W/2,H*.775);
const nm=T_(d.c,d.l);g.fillStyle='#8EDBFF';fit(nm,700,H*.047,W*.6);g.fillText(nm,W/2,H*.838);
const tm_=ar?'زمن الإجابة: '+d.t.toLocaleString('ar-EG',{minimumFractionDigits:1,maximumFractionDigits:1})+' ثانية':'RESPONSE TIME: '+d.t.toFixed(1)+' SECONDS';
g.fillStyle='#fff';fit(tm_,700,H*.04,W*.38);g.fillText(tm_,W/2,H*.96)}
const T_=(i,l)=>WN[i][l=='ar'?1:0];
function dl(cv){if(!cv)return;cv.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='science-wheel-certificate.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)},'image/png')}
function mkQR(d){const q=$('#qr'),m=$('#qm');m.textContent='';q.style.display='none';
const base=PUBLIC_URL||(/^https?:$/.test(location.protocol)?location.origin+location.pathname:'');if(!base){m.textContent=T(U.nohost);return}
if(typeof qrcode=='undefined'){m.textContent=T(U.noqr);return}
const url=base+'?c=1&n='+encodeURIComponent(d.n)+'&l='+d.l+'&ch='+d.c+'&t='+d.t.toFixed(1);
try{const o=qrcode(0,'M');o.addData(url);o.make();const n=o.getModuleCount(),px=Math.floor(560/(n+8)),z=(n+8)*px,g=q.getContext('2d');q.width=q.height=z;g.fillStyle='#fff';g.fillRect(0,0,z,z);g.fillStyle='#000';
for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(o.isDark(r,c))g.fillRect((c+4)*px,(r+4)*px,px,px);q.style.display='block'}catch(e){m.textContent=T(U.noqr)}}
function askName(){if(!lastR)return;if(vname)return showCert();show('s4');const i=$('#ni');i.value='';i.placeholder=T(U.nmph);setTimeout(()=>i.focus(),50)}
function nameOk(){const n=clean($('#ni').value);if(!n)return;vname=n;showCert()}
async function showCert(){if(!lastR)return;show('s5');const d={n:vname,l:L,c:lastR.c,t:lastR.t};await cimgReady;drawCert($('#cpv'),d);mkQR(d);conf(200);sfx('win')}

const CP=parseCert();
if(CP){setLang(CP.l);$$('.scr').forEach(s=>s.classList.remove('on'));$('#cp').classList.add('on');CPC=document.createElement('canvas');cimgReady.then(()=>{drawCert(CPC,CP);$('#cpi').src=CPC.toDataURL('image/png')})}
